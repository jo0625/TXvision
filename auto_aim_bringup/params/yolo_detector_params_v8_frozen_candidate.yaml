# Explicit normalized dual-PnP candidate; the generic launch default remains fixed.
yolo_armor_detector:
  ros__parameters:
    model: "${YOLO_ARMOR_MODEL}"
    image_topic: /image_raw
    camera_info_topic: /camera_info
    debug_topic: /detector/result_img
    armors_topic: /detector/armors
    imgsz: 640
    conf: 0.40
    nms_iou: 0.7
    max_det: 300
    agnostic_nms: false
    device: ""
    warmup: true
    publish_debug: true
    # Display-only worker limits; detection still uses the original image.
    debug_max_fps: 60.0  # Maximum display publish rate, Hz.
    debug_max_width: 960  # Detection still uses the original camera resolution.
    # Keep the operator view focused on candidates that passed geometry and PnP.
    draw_rejected_candidates: false
    image_qos_depth: 1
    type_strategy: normalized_dual_pnp_latch
    armor_type: small
    armor_number: armor
    detect_color: -1
    color_margin: 8.0
    min_quad_area: 25.0
    min_light_length: 4.0
    min_keypoint_conf: 0.15
    max_reprojection_error: 12.0
    min_pnp_distance: 0.1
    max_pnp_distance: 10.0
    diagnostics_period: 30
    gray_threshold: 140
