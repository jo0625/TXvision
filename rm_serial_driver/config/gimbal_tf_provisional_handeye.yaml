gimbal_tf:
  ros__parameters:
    feedback_topic: /serial_bridge/feedback

    world_frame: odom
    yaw_frame: yaw_frame
    pitch_frame: pitch_joint
    camera_link_frame: camera_link
    camera_optical_frame: camera_optical_frame
    muzzle_frame: muzzle  # User-reported muzzle position, 2026-10-23.

    # Controller angles, radians. Horizontal zero updated 2026-10-23.
    yaw_raw_offset_rad: 0.0
    # Level zero from user-confirmed horizontal capture, 2026-10-23.
    # 6000 samples / 30 s; pitch direction and scale remain unverified.
    pitch_raw_offset_rad: -0.001259736872589
    pitch_raw_scale: 1.023925824751

    # Mechanically measured yaw-axis to pitch-axis translation, metres.
    yaw_to_pitch_x: 0.0
    yaw_to_pitch_y: 0.0
    yaw_to_pitch_z: 0.178

    # Approximate user measurements with the mechanism level (2026-10-23).
    # Muzzle 0.38 m above ground; pitch-axis origin approximately 0.18 m.
    # Muzzle is 0.025 m forward of pitch origin, centered laterally.
    pitch_to_muzzle_x: 0.025
    pitch_to_muzzle_y: 0.0
    pitch_to_muzzle_z: 0.0

    # Test-only result from the 2026-09-17 fixed-board sample set.
    # Do not promote these values to deployment without a formal recalibration.
    pitch_to_camera_x: 0.131309861
    pitch_to_camera_y: -0.013936168
    pitch_to_camera_z: -0.039414315

    camera_mount_rpy_x: -0.058740775
    camera_mount_rpy_y: 0.070898036
    camera_mount_rpy_z: 0.048253959
